# ==========================================
# 0. LOAD SECRETS (THIS IS THE MOST IMPORTANT LINE)
# ==========================================
spring.profiles.include=secret

# ==========================================
# 1. SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# 2. JPA & HIBERNATE SETTINGS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. RABBITMQ CONNECTION (Docker Default)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
# ==========================================
# 4. COINGECKO API SETTINGS
# ==========================================
# The URL used to fetch live prices for the dashboard
COINGECKO_API_URL=https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,tether,binancecoin,ripple,cardano,dogecoin,polkadot,chainlink&vs_currencies=usd